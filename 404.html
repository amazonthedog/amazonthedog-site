@font-face { font-family: "Fredoka"; font-style: normal; font-weight: 300 700; font-display: swap; src: url(/fonts/fredoka-latin-var.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fonts/inter-latin-var.woff2) format("woff2"); }
:root {
  --bg: #F6F1E7; --ink: #141414; --muted: #5B554B; --teal: #1FA3A3; --teal-strong: #137F80; --on-teal: #FFFFFF; --green: #2F6B3F; --gold: #E3B23C;

  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121412; --ink: #F3EEE3; --muted: #B6AFA2; --teal: #2BB8B8; --teal-strong: #2BB8B8; --on-teal: #0B1414; --green: #7DBB8C; --gold: #EBC15A; color-scheme: dark; }
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.6; padding: 32px 16px; }
main { max-width: 560px; display: grid; gap: 20px; justify-items: start; }
.disc { width: 132px; height: 48px; border-radius: 50%; transform: rotate(-14deg); box-shadow: 0 10px 18px -10px rgba(0,0,0,.45);

.eyebrow { margin: 0; font-family: var(--display); font-weight: 500; font-size: 0.875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 7vw, 3.5rem); line-height: 1.08; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; color: var(--muted); font-size: 1.125rem; }
a.btn { display: inline-flex; align-items: center; font-family: var(--display); font-weight: 600; font-size: 1.125rem; text-decoration: none; padding: 14px 22px; border-radius: 999px; background: var(--teal-strong); color: var(--on-teal); }
a.btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
